<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Auto-Fit Clothes</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background: #1a1a1a; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-panel { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
    <!-- Import Three.js and GLTFLoader -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com",
          "three/addons/": "https://unpkg.com"
        }
      }
    </script>
</head>
<body>
    <div id="ui-panel">
        <h3>3D Auto-Fit Controls</h3>
        <button id="fit-btn">Auto-Fit Clothes</button>
    </div>
    <div id="canvas-container"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
